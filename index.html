
<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCO3hWdEOYF2-NpH4mDtPtUqziYoQMbFM",
  authDomain: "kvk-voice-app.firebaseapp.com",
  projectId: "kvk-voice-app",
  storageBucket: "kvk-voice-app.firebasestorage.app",
  messagingSenderId: "232069395880",
  appId: "1:232069395880:web:72054418e3b8cd7370d99d",
  measurementId: "G-BD0GF8KGD1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let username = "";
let currentRoom = "";
let muted = true;

let friends = JSON.parse(localStorage.getItem("kvk_friends") || "[]");
let privateRooms = JSON.parse(localStorage.getItem("kvk_rooms") || "[]");
let chats = JSON.parse(localStorage.getItem("kvk_chats") || "{}");
let currentCode = "";

function status(message) {
  document.getElementById("loginStatus").textContent = message;
}

// GOOGLE LOGIN - POPUP METHOD
async function loginGoogle() {
  try {
    status("Opening Google login...");
    document.getElementById("googleBtn").disabled = true;

    await setPersistence(auth, browserLocalPersistence);

    const result = await signInWithPopup(auth, provider);
    currentUser = result.user;

    status("Login successful!");
  } catch (error) {
    console.error("Google Login Error:", error);
    status("Login failed: " + error.message);
  } finally {
    document.getElementById("googleBtn").disabled = false;
  }
}

async function logoutGoogle() {
  try {
    await signOut(auth);
  } catch (error) {
    alert(error.message);
  }
}

// LOGIN STATE
onAuthStateChanged(auth, user => {
  currentUser = user;

  if (user) {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appShell").style.display = "block";

    username = user.displayName || "New User";

    updateProfileDisplay();
    renderPublicRooms();
    renderFriends();

  } else {
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appShell").style.display = "none";
  }
});

function updateProfileDisplay() {
  document.getElementById("homeName").textContent = username;
  document.getElementById("usernameInput").value = username;
  document.getElementById("googleEmail").textContent = currentUser.email || "";

  const photo = currentUser.photoURL;

  ["homeAvatar", "profileAvatar"].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = "";

    if (photo) {
      const img = document.createElement("img");
      img.src = photo;
      img.alt = "Profile";
      el.appendChild(img);
    } else {
      el.textContent = username.charAt(0).toUpperCase();
    }
  });
}

async function saveProfile() {
  const name = document.getElementById("usernameInput").value.trim();

  if (!name) {
    alert("Enter a username");
    return;
  }

  try {
    await updateProfile(currentUser, { displayName: name });
    username = name;
    updateProfileDisplay();

    document.getElementById("profileStatus").textContent = "Profile updated!";
  } catch (error) {
    document.getElementById("profileStatus").textContent = error.message;
  }
}

function showPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));

  document.getElementById(page).classList.add("active");

  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));

  if (page === "home" || page === "roomPage") {
    document.getElementById("navHome").classList.add("active");
  }

  if (page === "friends") {
    document.getElementById("navFriends").classList.add("active");
  }

  if (page === "profile") {
    document.getElementById("navProfile").classList.add("active");
  }
}

function renderPublicRooms() {
  const box = document.getElementById("publicRooms");
  box.innerHTML = "";

  ["Gaming Room", "Friends Room", "Chill Room"].forEach(name => {
    const div = document.createElement("div");
    div.className = "room";

    const label = document.createElement("b");
    label.textContent = "🎙 " + name;

    const btn = document.createElement("button");
    btn.textContent = "Join";
    btn.onclick = () => joinRoom(name);

    div.append(label, btn);
    box.appendChild(div);
  });
}

function createPrivateRoom() {
  currentCode = Math.random().toString(36).substring(2, 8).toUpperCase();

  privateRooms.push(currentCode);
  localStorage.setItem("kvk_rooms", JSON.stringify(privateRooms));

  document.getElementById("generatedCode").textContent = currentCode;
  document.getElementById("privateResult").classList.remove("hidden");
}

async function copyCode() {
  try {
    await navigator.clipboard.writeText(currentCode);
    alert("Code copied!");
  } catch (error) {
    alert("Your code: " + currentCode);
  }
}

function joinPrivateRoom() {
  const code = document.getElementById("privateCode").value.trim().toUpperCase();

  if (!code) {
    alert("Enter room code");
    return;
  }

  if (!privateRooms.includes(code)) {
    alert("Room not found on this device.");
    return;
  }

  joinRoom("Private Room - " + code);
}

function joinRoom(name) {
  currentRoom = name;
  muted = true;

  document.getElementById("roomTitle").textContent = name;
  document.getElementById("micBtn").textContent = "🎙 Unmute";
  document.getElementById("micBtn").className = "green";
  document.getElementById("roomStatus").textContent = "You joined " + name;

  renderMessages();
  showPage("roomPage");
}

function leaveRoom() {
  currentRoom = "";
  showPage("home");
}

function toggleMic() {
  muted = !muted;

  document.getElementById("micBtn").textContent =
    muted ? "🎙 Unmute" : "🔇 Mute";

  document.getElementById("micBtn").className =
    muted ? "green" : "danger";

  document.getElementById("roomStatus").textContent =
    muted ? "Muted (demo)" : "Unmuted (demo)";
}

function renderMessages() {
  const box = document.getElementById("messages");
  box.innerHTML = "";

  (chats[currentRoom] || []).forEach(item => {
    const div = document.createElement("div");
    div.className = "msg";

    const b = document.createElement("b");
    b.textContent = item.name;

    const p = document.createElement("p");
    p.textContent = item.text;

    div.append(b, p);
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("chatInput");
  const message = input.value.trim();

  if (!message || !currentRoom) return;

  if (!chats[currentRoom]) {
    chats[currentRoom] = [];
  }

  chats[currentRoom].push({
    name: username,
    text: message
  });

  localStorage.setItem("kvk_chats", JSON.stringify(chats));

  input.value = "";
  renderMessages();
}

function addFriend() {
  const input = document.getElementById("friendName");
  const name = input.value.trim();

  if (!name) return;

  if (friends.some(x => x.toLowerCase() === name.toLowerCase())) {
    alert("Already added");
    return;
  }

  friends.push(name);
  localStorage.setItem("kvk_friends", JSON.stringify(friends));

  input.value = "";
  renderFriends();
}

function renderFriends() {
  const box = document.getElementById("friendList");
  box.innerHTML = "";

  if (!friends.length) {
    box.textContent = "No friends added yet.";
    return;
  }

  friends.forEach((name, index) => {
    const div = document.createElement("div");
    div.className = "room";

    const label = document.createElement("b");
    label.textContent = "👤 " + name;

    const btn = document.createElement("button");
    btn.className = "danger";
    btn.textContent = "Remove";

    btn.onclick = () => {
      friends.splice(index, 1);
      localStorage.setItem("kvk_friends", JSON.stringify(friends));
      renderFriends();
    };

    div.append(label, btn);
    box.appendChild(div);
  });
}

// CONNECT HTML BUTTONS
Object.assign(window, {
  loginGoogle,
  logoutGoogle,
  saveProfile,
  showPage,
  createPrivateRoom,
  copyCode,
  joinPrivateRoom,
  joinRoom,
  leaveRoom,
  toggleMic,
  sendMessage,
  addFriend
});

// SERVICE WORKER
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
}
</script>
