<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101321">
  <title>KVK Voice Hub</title>
<style>
    * { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #101321; color: white; }
button, input { font: inherit; }
button { width: 100%; padding: 13px 16px; margin: 6px 0; border: 0; border-radius: 10px; background: #5865f2; color: white; font-weight: bold; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.green { background: #20a56b; }
.red { background: #d94c5c; }
input { width: 100%; padding: 13px; margin: 7px 0 12px; border: 1px solid #39415c; border-radius: 9px; background: #1b2035; color: white; }
.hidden { display: none !important; }
header { padding: 16px; background: #191e33; border-bottom: 1px solid #303751; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
header button { width: auto; margin: 0; }
.logo { color: #9aa5ff; font-size: 20px; font-weight: bold; }
.container { width: min(100% - 28px, 520px); margin: 24px auto; }
.card { padding: 20px; margin: 14px 0; border: 1px solid #303751; border-radius: 15px; background: #1b2035; }
.muted { color: #aab1ca; font-size: 14px; }
.status { color: #ffca70; min-height: 22px; overflow-wrap: anywhere; }
#loginScreen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.loginbox { width: min(100%, 400px); padding: 28px; border: 1px solid #303751; border-radius: 18px; background: #1b2035; text-align: center; }
#app { display: none; }
</style>
</head>
<body>
  <section id="loginScreen"><div class="loginbox"><div style="font-size:48px">🎙️</div><h1 class="logo">KVK VOICE HUB</h1><p class="muted">Voice rooms • Invite link • Mic controls</p><button id="googleBtn">Continue with Google</button><p id="loginStatus" class="status">Sign in to continue.</p></div></section>
<div id="app">
<header><div class="logo">🎙 KVK VOICE HUB</div><button id="logoutBtn" class="red">Logout</button></header>
<main class="container"><section class="card"><h2 id="welcome">Welcome</h2><p class="muted">Create a room or enter an invite code.</p><button id="createRoomBtn">Create voice room</button><label for="roomInput">Room code or invite link</label><input id="roomInput" placeholder="Enter room code"><button id="joinRoomBtn">Join room</button><button id="shareBtn" class="green">Share room link</button><p id="roomStatus" class="status">Not connected.</p><p id="participantStatus" class="muted"></p></section>
<section class="card"><h2>🎙 Voice controls</h2><button id="micBtn" class="green" disabled>Unmute microphone</button><button id="leaveBtn" class="red" disabled>Leave room</button><p class="muted">Join செய்யும்போது mic mute-ஆக இருக்கும். பேச, Unmute அழுத்தி microphone permission கொடுங்கள்.</p></section></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { Room, RoomEvent } from "https://esm.sh/livekit-client@2.15.6?bundle";
const firebaseConfig = {
  apiKey: "AIzaSyCO3hWdEOYF2-NhFp4mDtPtUqziYoQMbFM",
  authDomain: "kvk-voice-app.firebaseapp.com",
  projectId: "kvk-voice-app",
  storageBucket: "kvk-voice-app.firebasestorage.app",
  messagingSenderId: "232069395880",
  appId: "1:232069395880:web:72054418e3b8cd7370d99d",
  measurementId: "G-BD0GF8KGD1"
};
const LIVEKIT_URL = "wss://YOUR_LIVEKIT_HOST";
const TOKEN_ENDPOINT = "https://YOUR_BACKEND_HOST/token";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });
let currentUser = null;
let liveRoom = null;
let isMuted = true;
let leavingRoom = false;
const audioElements = new Set();
const $ = (id) => document.getElementById(id);
function setRoomStatus(message) { $("roomStatus").textContent = message; }
function parseRoomId(value) {
  const input = value.trim();
  let roomId = input;
  try { const url = new URL(input); roomId = url.searchParams.get("room") || roomId; } catch {}
  roomId = roomId.trim().toUpperCase();
  return /^[A-Z0-9_-]{6,64}$/.test(roomId) ? roomId : null;
}
function getInviteRoomFromUrl() {
  const roomId = new URLSearchParams(location.search).get("room");
  return roomId ? parseRoomId(roomId) : null;
}
async function loginGoogle() {
  const button = $("googleBtn");
  button.disabled = true;
  $("loginStatus").textContent = "Google-க்கு connect ஆகிறது…";
  try { await setPersistence(auth, browserLocalPersistence); await signInWithPopup(auth, provider); }
  catch (error) {
    console.error("Google login error:", error);
    $("loginStatus").textContent = error.code === "auth/unauthorized-domain"
      ? "இந்த website domain-ஐ Firebase Authentication → Authorized domains-ல் சேர்க்கவும்."
      : error.code === "auth/popup-blocked"
        ? "Popup block ஆகியுள்ளது. Browser popup-ஐ அனுமதித்து மீண்டும் முயற்சி செய்யுங்கள்."
        : `Login முடியவில்லை: ${error.message}`;
  } finally { button.disabled = false; }
}
async function logoutGoogle() { await leaveRoom(false); await signOut(auth); }
async function getLiveKitToken(roomName) {
  const firebaseToken = await currentUser.getIdToken();
  const response = await fetch(TOKEN_ENDPOINT, { method: "POST", headers: { "Authorization": `Bearer ${firebaseToken}`, "Content-Type": "application/json" }, body: JSON.stringify({ roomName }) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.token) throw new Error(data.error || `Token server error (${response.status})`);
  return data.token;
}
async function joinRoom(roomName) {
  if (!currentUser) { setRoomStatus("முதலில் Google-ல் sign in செய்யுங்கள்."); return; }
  if (!roomName) { setRoomStatus("சரியான room code அல்லது invite link-ஐ உள்ளிடுங்கள்."); return; }
  $("joinRoomBtn").disabled = true;
  $("createRoomBtn").disabled = true;
  setRoomStatus("Voice room-க்கு connect ஆகிறது…");
  try {
    await leaveRoom(false);
    const token = await getLiveKitToken(roomName);
    const room = new Room();
    liveRoom = room;
    leavingRoom = false;
    room.on(RoomEvent.TrackSubscribed, (track) => {
      if (track.kind !== "audio") return;
      const audio = track.attach();
      audio.autoplay = true;
      audio.playsInline = true;
      audio.style.display = "none";
      document.body.appendChild(audio);
      audioElements.add(audio);
      audio.play().catch(() => setRoomStatus("Audio கேட்க முடியவில்லை. Page-ல் ஒருமுறை tap செய்து மீண்டும் முயற்சி செய்யுங்கள்."));
    });
    room.on(RoomEvent.TrackUnsubscribed, (track) => { track.detach().forEach((element) => { element.remove(); audioElements.delete(element); }); });
    room.on(RoomEvent.ParticipantConnected, updateParticipantCount);
    room.on(RoomEvent.ParticipantDisconnected, updateParticipantCount);
    room.on(RoomEvent.Disconnected, () => { clearAudio(); if (!leavingRoom) { liveRoom = null; setRoomStatus("Room connection துண்டிக்கப்பட்டது."); updateControls(false); } });
    await room.connect(LIVEKIT_URL, token);
    await room.localParticipant.setMicrophoneEnabled(false);
    isMuted = true;
    $("roomInput").value = roomName;
    setRoomStatus(`Room ${roomName}-ல் இணைந்துள்ளீர்கள். Mic mute-ஆக உள்ளது.`);
    updateControls(true);
    updateParticipantCount();
  } catch (error) {
    console.error("Join room error:", error);
    liveRoom = null;
    setRoomStatus(`Room-ல் சேர முடியவில்லை: ${error.message}`);
    updateControls(false);
  } finally { $("joinRoomBtn").disabled = false; $("createRoomBtn").disabled = false; }
}
async function createRoom() {
  const roomId = crypto.randomUUID().replaceAll("-", "").slice(0, 16).toUpperCase();
  $("roomInput").value = roomId;
  await joinRoom(roomId);
}
async function toggleMic() {
  if (!liveRoom) { setRoomStatus("முதலில் ஒரு room-ல் join செய்யுங்கள்."); return; }
  try {
    isMuted = !isMuted;
    await liveRoom.localParticipant.setMicrophoneEnabled(!isMuted);
    $("micBtn").textContent = isMuted ? "Unmute microphone" : "Mute microphone";
    $("micBtn").className = isMuted ? "green" : "red";
    setRoomStatus(isMuted ? "Mic mute செய்யப்பட்டுள்ளது." : "Mic on.");
  } catch (error) { isMuted = true; console.error("Microphone error:", error); setRoomStatus("Mic இயங்கவில்லை. Browser microphone permission-ஐ சரிபாருங்கள்."); }
}
async function shareRoomLink() {
  const roomId = parseRoomId($("roomInput").value);
  if (!roomId) { setRoomStatus("முதலில் room create செய்யுங்கள் அல்லது room code உள்ளிடுங்கள்."); return; }
  const inviteUrl = new URL(location.href);
  inviteUrl.search = "";
  inviteUrl.hash = "";
  inviteUrl.searchParams.set("room", roomId);
  try {
    if (navigator.share) await navigator.share({ title: "KVK Voice Hub", text: "என் voice room-ல் join செய்யுங்கள்", url: inviteUrl.toString() });
    else { await navigator.clipboard.writeText(inviteUrl.toString()); setRoomStatus("Invite link copy செய்யப்பட்டது."); }
  } catch (error) { if (error.name !== "AbortError") setRoomStatus("Link share முடியவில்லை. Room code-ஐ copy செய்து அனுப்புங்கள்."); }
}
async function leaveRoom(goHome = true) {
  leavingRoom = true;
  if (liveRoom) { try { await liveRoom.disconnect(); } catch (error) { console.warn("Disconnect warning:", error); } }
  liveRoom = null;
  clearAudio();
  isMuted = true;
  updateControls(false);
  $("participantStatus").textContent = "";
  if (goHome) setRoomStatus("Room-ஐ விட்டு வெளியேறிவிட்டீர்கள்.");
}
function clearAudio() { for (const audio of audioElements) { audio.pause(); audio.srcObject = null; audio.remove(); } audioElements.clear(); }
function updateControls(connected) {
  $("micBtn").disabled = !connected;
  $("leaveBtn").disabled = !connected;
  $("micBtn").textContent = "Unmute microphone";
  $("micBtn").className = "green";
}
function updateParticipantCount() {
  if (!liveRoom) return;
  const count = liveRoom.remoteParticipants.size + 1;
  $("participantStatus").textContent = `இந்த room-ல் ${count} பேர் இருக்கிறார்கள்.`;
}
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    $("loginScreen").classList.add("hidden");
    $("app").style.display = "block";
    $("welcome").textContent = `வணக்கம், ${user.displayName || "User"}`;
    const inviteRoom = getInviteRoomFromUrl();
    if (inviteRoom) $("roomInput").value = inviteRoom;
  } else {
    $("loginScreen").classList.remove("hidden");
    $("app").style.display = "none";
  }
});
$("googleBtn").addEventListener("click", loginGoogle);
$("logoutBtn").addEventListener("click", logoutGoogle);
$("createRoomBtn").addEventListener("click", createRoom);
$("joinRoomBtn").addEventListener("click", () => {
  const roomId = parseRoomId($("roomInput").value);
  if (!roomId) { setRoomStatus("சரியான room code அல்லது invite link-ஐ உள்ளிடுங்கள்."); return; }
  joinRoom(roomId);
});
$("shareBtn").addEventListener("click", shareRoomLink);
$("micBtn").addEventListener("click", toggleMic);
$("leaveBtn").addEventListener("click", () => leaveRoom(true));
</script>
</body>
</html>
